name: Update rates
on:
  schedule:
    - cron: "0 12 * * 1"   # every Monday 12:00 UTC, catches new 7520 months and keeps the 10 year fresh
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch rates
        run: python scripts/update_rates.py
      - name: Watch policy sources
        run: python scripts/policy_watch.py
      - name: Commit if changed
        run: |
          if ! git diff --quiet data/rates.json data/policy-watch.json; then
            git config user.name "rates-bot"
            git config user.email "actions@github.com"
            git add data/rates.json data/policy-watch.json
            git commit -m "Auto update: figures and policy watch"
            git push
          else
            echo "No rate changes"
          fi
